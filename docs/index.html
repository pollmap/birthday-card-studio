<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e7">
  <title>생일 카드 스튜디오</title>
  <meta name="description" content="찬희의 생일 카드가 보관되는 곳입니다. 각 카드는 받은 링크로 열 수 있습니다.">
  <style>
    :root { font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; color: #3e332c; background: #f6f1e7; }
    body { margin: 0; min-height: 100svh; padding: 24px; display: grid; place-items: center; }
    main { width: min(100%, 540px); text-align: center; }
    .mark { font-size: 42px; }
    h1 { margin: 15px 0 12px; font-size: clamp(28px, 6vw, 42px); letter-spacing: -.07em; }
    p { margin: 0; color: #74665b; line-height: 1.7; }
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">✉️</div><h1>생일 카드 스튜디오</h1><p>각 생일 카드는 받은 링크에서 열 수 있습니다.</p></main></body>
</html>
