<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재연님, 발표 파이팅!</title>
<meta name="description" content="재연님 발표 응원단 출동! 할 수 있다, 쭉쭉 가자!">
<meta property="og:type" content="website">
<meta property="og:title" content="재연님, 발표 파이팅!">
<meta property="og:description" content="재연님 발표 응원단 출동! 할 수 있다, 쭉쭉 가자!">
<meta property="og:url" content="https://pollmap.github.io/birthday-card-studio/jaeyeon/">
<meta property="og:image" content="https://pollmap.github.io/birthday-card-studio/jaeyeon/og-v1.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://pollmap.github.io/birthday-card-studio/jaeyeon/og-v1.png">
<link rel="canonical" href="https://pollmap.github.io/birthday-card-studio/jaeyeon/">
<meta name="theme-color" content="#fff6e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="cheer.css?v=1">
<script src="buddies.js?v=1" defer></script>
<script src="cheer.js?v=1" defer></script>
</head>
<body>
<main id="card" class="card" data-phase="idle">
  <div class="rim" aria-hidden="true"></div>
  <header>
    <p class="eyebrow">PRESENTATION DAY · 재연님 응원단</p>
    <h1><span class="who">재연님, 발표</span><strong aria-label="파이팅!"><i style="--i:0" aria-hidden="true">파</i><i style="--i:1" aria-hidden="true">이</i><i style="--i:2" aria-hidden="true">팅</i><i style="--i:3" aria-hidden="true">!</i></strong></h1>
    <p class="sub"><span class="live">LIVE</span><b id="ticker">발표 할 수 있다!</b></p>
  </header>

  <section class="stage" id="stage" data-scene="idle" aria-label="말랑이, 삐약이, 개굴이 응원단이 재연님을 발표를 응원하는 무대. 캐릭터를 누르면 반응합니다.">
    <div class="world" id="world">
      <div class="sky" aria-hidden="true">
        <i class="cloud" style="top:20%;--dur:46s;--delay:-8s"></i>
        <i class="cloud" style="top:44%;--dur:60s;--delay:-34s;--s:.75"></i>
        <i class="cloud" style="top:31%;--dur:52s;--delay:-22s;--s:1.15"></i>
        <i class="spark" style="left:9%;top:36%;--d:0s"></i>
        <i class="spark" style="left:86%;top:30%;--d:.8s;--c:#ff8fa3"></i>
        <i class="spark" style="left:72%;top:52%;--d:1.5s;--c:#7fd3c3;width:10px;height:10px"></i>
        <i class="spark" style="left:20%;top:58%;--d:2.1s;--c:#8ec5ff;width:10px;height:10px"></i>
        <i class="floor"></i>
      </div>

      <svg class="rise" viewBox="0 0 400 240" aria-hidden="true">
        <path class="line" pathLength="1" d="M24 214L104 168L150 186L226 112L262 130L346 46" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="line" pathLength="1" d="M24 214L104 168L150 186L226 112L262 130L346 46" fill="none" stroke="#ff8a7a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="head" d="M316.5 51.2L346 46L340.8 75.5" fill="none" stroke="#ff8a7a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="tag" x="336" y="116" transform="rotate(-12 336 116)" font-family="Jua, 'Malgun Gothic', sans-serif" font-size="34" fill="#ff6b5e" stroke="#fff" stroke-width="8" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">쭉쭉!</text>
      </svg>

      <div class="bunting" aria-hidden="true">
        <svg viewBox="0 0 400 60" preserveAspectRatio="none"><path class="str" pathLength="1" d="M0 6Q200 46 400 6" fill="none" stroke="#a9805f" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
        <span class="flag" style="--i:0;--x:11%;--y:23%;--c:#ff9a8c">발</span>
        <span class="flag" style="--i:1;--x:24%;--y:34%;--c:#ffd45c">표</span>
        <span class="flag" style="--i:2;--x:37%;--y:41%;--c:#8fdccb">대</span>
        <span class="flag" style="--i:3;--x:50%;--y:43%;--c:#ffa3b5">성</span>
        <span class="flag" style="--i:4;--x:63%;--y:41%;--c:#9ccbff">공</span>
        <span class="flag" style="--i:5;--x:76%;--y:34%;--c:#c9b0f5">!</span>
        <span class="flag" style="--i:6;--x:89%;--y:23%;--c:#ffb86b">!</span>
      </div>

      <div class="stamp" id="stamp" aria-hidden="true"></div>

      <div class="squad" id="squad">
        <div class="buddy" data-kind="chick" data-face="calm" style="--d:0s;--blink:-1.2s"><i class="shadow"></i><div class="hop"><div class="squash"></div></div><p class="bubble"></p></div>
        <div class="buddy" data-kind="mallang" data-face="calm" style="--d:.12s;--blink:-3s"><i class="shadow"></i><div class="hop"><div class="squash"></div></div><p class="bubble"></p></div>
        <div class="buddy" data-kind="frog" data-face="calm" style="--d:.24s;--blink:-.4s"><i class="shadow"></i><div class="hop"><div class="squash"></div></div><p class="bubble"></p></div>
      </div>
    </div>
    <canvas id="fx" aria-hidden="true"></canvas>
  </section>

  <footer>
    <div class="gauge" id="gauge" role="progressbar" aria-label="파이팅 게이지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="gauge-label">파이팅 게이지</span>
      <span class="gauge-bar"><i id="gaugeFill"></i></span>
      <b id="gaugeNum">0%</b>
    </div>
    <button id="play" class="primary" data-start="응원단 출동!" data-again="한 번 더 응원하기"><span>응원단 출동!</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 10v4a1 1 0 0 0 1 1h2l8 4V5L6 9H4a1 1 0 0 0-1 1z"/><path d="M17.5 8.5a5 5 0 0 1 0 7M20 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <nav aria-label="카드 설정"><button id="sound" aria-pressed="false">소리 켜기</button><span aria-hidden="true">·</span><button id="share">링크 복사</button></nav>
    <p id="notice" role="status"></p>
  </footer>
</main>
</body>
</html>
